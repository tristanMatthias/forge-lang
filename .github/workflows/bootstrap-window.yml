# sdmg.2 — bootstrap-window gate.
#
# Every PR into the integration branch must (a) not change the pinned
# seed (no seed.lock bumps — feature branches never cycle the seed;
# the seed train on the integration branch does) and (b) build its
# compiler source from
# the integration branch's CURRENT pristine seed, smoke-tested. Any
# two branches that pass are compilable by the same seed by
# construction, so the "no seed can compile the union" merge state is
# unrepresentable. Logic lives in
# bootstrap/scripts/diagnose.sh --check-bootstrap-window; this
# workflow only provisions the toolchain and invokes it.
name: bootstrap-window

on:
  pull_request:
    branches: [feat/crafting-intepreters]

concurrency:
  group: bootstrap-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check needs the merge-base with the
          # integration branch and that branch's seed blob.
          fetch-depth: 0

      - name: Install LLVM 20 toolchain
        run: |
          # Prefer the distro archive; only fall back to executing the
          # apt.llvm.org bootstrap script (remote code under sudo) when
          # the runner's archive doesn't carry LLVM 20 yet.
          sudo apt-get update -y
          if ! sudo apt-get install -y --no-install-recommends               llvm-20 llvm-20-dev llvm-20-tools clang-20 lld-20; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 20
            sudo apt-get install -y --no-install-recommends llvm-20-dev lld-20 clang-20
          fi
          # diagnose.sh probes `ld.lld` by name for the @-symbol-safe linker.
          sudo ln -sf /usr/lib/llvm-20/bin/ld.lld /usr/local/bin/ld.lld

      - name: Bootstrap-window check
        run: bash bootstrap/scripts/diagnose.sh --check-bootstrap-window "origin/${{ github.base_ref }}"
