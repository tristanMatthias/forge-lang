# rcsf.3 — strict-allocator gate.
#
# Runtime sibling of the AVRA_VERIFY_RC IR gate (rcsf.2). Every PR into the
# integration branch runs the whole spec suite under AVRA_RC_STRICT=1, which
# poisons freed RC payloads, quarantines them from reuse, and ABORTS with a
# backtrace the instant a release path receives a pointer to already-freed RC
# memory — the zm77 phantom-release class. Because bs2 itself runs under
# strict mode as it compiles + runs each test binary, this validates the
# COMPILER's own RC discipline as well as every test program's: a latent
# use-after-free fails the job loudly instead of shipping silent corruption.
# Logic lives in bootstrap/scripts/diagnose.sh --rc-strict-suite; this
# workflow only provisions the toolchain and invokes it.
name: rc-strict

on:
  pull_request:
    branches: [feat/crafting-intepreters]

# Least privilege: a trust gate that builds + runs PR code — read only.
permissions:
  contents: read

concurrency:
  group: rc-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc-strict:
    runs-on: ubuntu-24.04
    # 60, not 45: the ps3t.6.6 surface work grew the suite by ~30
    # fixture-heavy specs (whole-program compile+link+run each — no warm
    # fixture cache on CI), and the 45-min ceiling started timing the job
    # out (reported as "cancelled") on cold runners.
    timeout-minutes: 60
    steps:
      # Pinned to a commit (what @v4 resolves to at pin time): tags are
      # mutable and this workflow is a trust gate.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Read-only workflow — never let the token outlive checkout.
          persist-credentials: false
          # Full history: cache-seed resolves the pinned seed blob.
          fetch-depth: 0

      - uses: ./.github/actions/setup-llvm

      # Restore the seed binary (content-keyed): the bs2 build reuses it
      # instead of re-running the ~3-4 min seed `llc`.
      - uses: ./.github/actions/cache-seed

      - name: Build bs2
        run: bash bootstrap/scripts/diagnose.sh --build-bs2

      # NO width override of any kind (t-kdyj.4). The controller identifies
      # RC strict as a distinct allocation profile, starts from its
      # conservative memory seed, and adapts to detected capacity and
      # pressure; `bs2 test` chooses in-shard worker width itself.
      #
      # AVRA_TEST_JOBS used to be pinned here. Its comment claimed to be a
      # FLAKE-PARITY knob, "NOT a memory or speed lever" — but the history
      # says otherwise, and the history is what this removal rests on:
      #
      #   a866ced8 (06-12) introduced it as an OOM throttle, explicitly
      #     temporary: "run the suite at reduced width UNTIL THE CROSS-PROCESS
      #     THROTTLE LANDS".
      #   fb1bc09a (07-18) added it here, also for memory (rc-strict's
      #     quarantine holds freed memory).
      #   49571a5b (07-18) took it 2 -> 1, again for memory: two overlapping
      #     ~3.5GB `@std` fixture rebuilds exceeded the runner.
      #   6f226e13 (07-20) REWROTE the comment into the flake-parity claim,
      #     while raising a different knob. The value never moved; only its
      #     justification did.
      #
      # Both conditions the original rationale named are now met. The
      # cross-process throttle landed (t-kdyj.1 slice 4: avra_compile_slot_gate,
      # flock-based, box-wide), alongside admission control and per-unit F4014
      # budgets. And the ~3.5GB-per-fixture rebuild it was throttling was a
      # CACHE BUG, not inherent cost — a bare `bs2 build --lib` derived no
      # AVRA_LIB_PKG_ROOT, so those fixtures could never hit the prebuild's
      # warm slot (#1117; guard: build/tests/libbuild_bare_root_test.av).
      #
      # The cited flake tickets do not corroborate the retrofitted claim:
      # uzs9.4 is CLOSED and uzs9.2 does not exist in the tracker.
      - name: Spec suite under AVRA_RC_STRICT=1
        run: bash bootstrap/scripts/diagnose.sh --rc-strict-suite
