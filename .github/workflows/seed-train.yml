# The seed train: after a merge lands on the integration branch, CI —
# not a human — advances the pinned seed so newly-landed features
# become dogfoodable in compiler src on the next rebase. Feature
# branches never cycle the seed (the bootstrap-window gate enforces
# it); this workflow is the only writer of seed.lock. Logic lives in
# bootstrap/scripts/diagnose.sh --seed-train; this workflow provisions
# the toolchain, runs it, and commits the lock bump.
name: seed-train

on:
  push:
    branches: [feat/crafting-intepreters]
    paths-ignore:
      # The train's own lock commit must not re-trigger the train.
      - 'bootstrap/seed/seed.lock'

permissions:
  contents: write

concurrency:
  # Serialize advances; never cancel a publish mid-flight.
  group: seed-train
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Pinned to a commit (what @v4 resolves to at pin time). Credentials
      # stay persisted on purpose: the train pushes the lock bump.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-llvm

      # Restore the seed binary + C objects (content-keyed) so the ~3-4 min
      # seed `llc` is skipped when the pin + C inputs are unchanged.
      - uses: ./.github/actions/cache-seed

      # The merged HEAD's seed×source fingerprint. A squash merge preserves the
      # compiler-source blobs, so this matches the fingerprint the PR's
      # seed-train-verify already published a PASS marker for. Tolerant: an
      # empty fingerprint just means no skip (the suite runs).
      - id: fp
        shell: bash
        run: echo "fp=$(bash bootstrap/scripts/diagnose.sh --seed-verify-fp || true)" >> "$GITHUB_OUTPUT"
      - id: passmarker
        if: steps.fp.outputs.fp != ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .seedpass
          key: seedpass-v1-${{ steps.fp.outputs.fp }}

      - name: Build from pin, verify, publish if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AVRA_SEED_REPO: ${{ github.repository }}
          # Belt and suspenders with the cross-process fixture-compile
          # throttle (--slot-exec): 4-vCPU runners still benefit from
          # reduced unit-thread width for the non-compile workload.
          AVRA_TEST_JOBS: "2"
          # Skip the redundant suite ONLY on an exact PASS-marker hit — i.e. the
          # PR's seed-train-verify already ran the full suite green on this exact
          # seed×source fingerprint (the marker is saved there only on success).
          # Any miss → empty → the suite runs (today's behaviour). Build + fixed
          # point + hermetic recompile + publish always run regardless.
          AVRA_SEED_TRAIN_SKIP_SUITE: ${{ steps.passmarker.outputs.cache-hit == 'true' && '1' || '' }}
        run: bash bootstrap/scripts/diagnose.sh --seed-train

      - name: Commit the lock bump
        env:
          # The trigger constrains this to the integration branch; the
          # indirection keeps the workflow correct if that ever changes.
          TRAIN_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- bootstrap/seed/seed.lock; then
            echo "pin unchanged — no train commit"
            exit 0
          fi
          git config user.name "seed-train[bot]"
          git config user.email "seed-train[bot]@users.noreply.github.com"
          git add bootstrap/seed/seed.lock
          v=$(sed -n 's/^version = //p' bootstrap/seed/seed.lock)
          git commit -m "chore(seed): cycle to v${v}"
          # A merge can land while we built; rebase the one-file commit
          # rather than failing the train.
          git pull --rebase origin "${TRAIN_BRANCH}"
          git push origin "HEAD:${TRAIN_BRANCH}"
