# HRN differential-test gate.
#
# Every PR into the integration branch must be behaviour-preserving at the
# IR level: the compiler built from the PR (NEW) and from the integration
# branch (OLD, the oracle) must emit BYTE-IDENTICAL IR for the same inputs
# — the whole compiler source (selfhost) plus the test corpus. This is the
# go-hard safety net of the AST-source-of-truth program (spine doc sec 8):
# rip the foundation out and instantly catch drift. Logic lives in
# bootstrap/scripts/diagnose.sh --diff-test; this workflow only provisions
# the toolchain and invokes it.
#
# A legitimate IR change (e.g. an intentional codegen improvement) trips
# this gate by design — confirm run-results match and advance the oracle.
name: diff-test

on:
  pull_request:
    branches: [feat/crafting-intepreters]
    # `labeled`/`unlabeled` beyond the default [opened, synchronize, reopened]:
    # an intended-ir-change PR is labeled AFTER it opens (you can't label a PR
    # that doesn't exist yet), so the opened-event run evaluates RUN_EQUIV with
    # no label and false-fails in byte-identity mode on the very divergence the
    # label exists to allow. Re-triggering on the label re-runs the oracle in
    # the correct (run-equivalence) mode. The job `if` keeps this cheap — only
    # the two oracle-mode labels re-run; other label churn is ignored.
    # intended-strictness-change is the same story for the other declared
    # outcome (NEW rejects OLD's source), so it is triggered the same way.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: a trust gate that builds + runs PR code — read only.
permissions:
  contents: read

concurrency:
  group: diff-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff-test:
    # Code events (opened/synchronize/reopened) always run. A label event runs
    # ONLY for the two labels that flip the oracle mode, so unrelated label
    # churn doesn't re-spend a 45-minute build.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'intended-ir-change'
      || github.event.label.name == 'intended-strictness-change'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Pinned to a commit (what @v4 resolves to at pin time): tags are
      # mutable and this workflow is a trust gate.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Read-only workflow — never let the token outlive checkout.
          persist-credentials: false
          # Full history: the harness resolves the integration base ref,
          # its seed blob, and the merge-base.
          fetch-depth: 0

      - uses: ./.github/actions/setup-llvm

      # Restore the seed binary (content-keyed): both the OLD (base) and NEW
      # (HEAD) compiler builds reuse it instead of re-running the seed `llc`.
      # `id: seed` exposes its fail-closed LLVM version for the difftest key below.
      - id: seed
        uses: ./.github/actions/cache-seed

      # Persist the per-ref compiler build cache across runs. dt_build_compiler
      # gates reuse on window_fingerprint (seed identity + compiler-source
      # blob-shas), so a restored compiler is reused ONLY when its source + seed
      # are byte-identical: the OLD (base) compiler survives a PR's force-pushes
      # (base source unchanged) — saving the ~6 min base rebuild — while NEW
      # rebuilds whenever HEAD's source changes. The github.sha suffix saves a
      # fresh entry per run; restore-keys restores the most recent same-(seed,
      # LLVM) prefix match. Correctness is the marker's (not the key's), and
      # diff-test's own byte-identical IR comparison is the backstop.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: bootstrap/build/difftest
          key: avra-difftest-${{ runner.os }}-llvm${{ steps.seed.outputs.llvm_ver }}-${{ hashFiles('bootstrap/seed/seed.lock') }}-${{ github.sha }}
          restore-keys: |
            avra-difftest-${{ runner.os }}-llvm${{ steps.seed.outputs.llvm_ver }}-${{ hashFiles('bootstrap/seed/seed.lock') }}-

      - name: Differential test (OLD=integration vs NEW=HEAD)
        env:
          # Indirection keeps the ref out of shell parsing — branch names
          # are validated by GitHub, but pass data as data.
          BASE_REF: ${{ github.base_ref }}
          # An `intended-ir-change` label switches the oracle from
          # byte-identity to run-equivalence: IR may diverge, but every
          # corpus artifact must RUN identically (and the suite must be
          # green — the rc-strict job). The documented landing path for
          # intentional codegen changes.
          RUN_EQUIV: ${{ contains(github.event.pull_request.labels.*.name, 'intended-ir-change') && '1' || '0' }}
          # An `intended-strictness-change` label declares the OTHER
          # legitimate way to trip this gate (t-zk6j): NEW REJECTS source
          # OLD accepts, because the PR adds a gate. The harness then
          # prints WHICH diagnostics NEW raises that OLD does not, and
          # re-runs the selfhost leg on NEW's OWN source — the input both
          # compilers accept — where the IR must still be byte-identical.
          # Without this, a strictness change had to be split across N+1
          # PRs (fixes first, gate second) purely as ceremony.
          STRICTNESS: ${{ contains(github.event.pull_request.labels.*.name, 'intended-strictness-change') && '1' || '0' }}
        run: |
          extra=""
          if [ "$RUN_EQUIV" = "1" ]; then
            extra="$extra --run-equiv"
            echo "intended-ir-change label present — running the run-equivalence oracle"
          fi
          if [ "$STRICTNESS" = "1" ]; then
            extra="$extra --intended-strictness"
            echo "intended-strictness-change label present — a NEW-only rejection of OLD's source is an expected outcome"
          fi
          bash bootstrap/scripts/diagnose.sh --diff-test --base "origin/${BASE_REF}" --new HEAD $extra

      # t-47hc.14 / t-jova: on a divergence, KEEP THE EVIDENCE. Every diagnosis of this
      # failure so far has been inferred from the job log, which serves only a ~600KB tail
      # and which `diff` itself truncates with a broken pipe — so the actual divergence has
      # never once been read whole. Four occurrences produced three wrong attributions and
      # two reverts of innocent commits. The files are a few MB; the guessing is not cheap.
      - name: Capture the divergent IR (on failure)
        if: failure()
        run: |
          wd=bootstrap/build/difftest/work
          if [ ! -f "$wd/self.old.ll" ] || [ ! -f "$wd/self.new.ll" ]; then
            echo "no selfhost IR pair — the compile failed before both sides were emitted"
            ls -la "$wd" 2>/dev/null || echo "(no work dir)"
            exit 0
          fi
          # `if: failure()` also fires for a CORPUS-only divergence, and the selfhost pair
          # exists by then either way. Rather than thread a status through the job, ask the
          # files: identical means selfhost agreed and the failure came from elsewhere.
          if cmp -s "$wd/self.old.ll" "$wd/self.new.ll"; then
            echo "selfhost IR is BYTE-IDENTICAL — this failure was NOT a selfhost divergence"
            echo "(corpus divergence, a rejected compile, or a non-diff-test step)"
            exit 0
          fi
          echo "=== selfhost IR: line counts"
          wc -l "$wd/self.old.ll" "$wd/self.new.ll"
          echo "=== divergence summary (first 200 diff lines, unified)"
          diff -u "$wd/self.old.ll" "$wd/self.new.ll" | head -200 || true

          # The recorded signature is a block of named struct types differing between the
          # sides. Two very different causes produce it, so the verdict PROVES which rather
          # than inferring it — an earlier version of this step compared only sorted type
          # lines, which reports "ordering" for a changed FUNCTION BODY as well, since the
          # type lines are equal in that case too.
          #
          # A type declaration is `%"…" = type …`. Everything else is the remainder.
          type_re='^%"[^"]*"[[:space:]]*=[[:space:]]*type([[:space:]]|$)'
          for side in old new; do
            grep -E   "$type_re" "$wd/self.$side.ll" > "/tmp/ty.$side" || true
            grep -vE  "$type_re" "$wd/self.$side.ll" > "/tmp/rest.$side" || true
          done
          echo "type decls: old=$(wc -l < /tmp/ty.old) new=$(wc -l < /tmp/ty.new)"
          if [ ! -s /tmp/ty.old ] && [ ! -s /tmp/ty.new ]; then
            echo "VERDICT: no type declarations matched on EITHER side — the selector is"
            echo "         wrong for this IR, so no classification is possible. Read the"
            echo "         diff above directly rather than trusting a verdict here."
            exit 0
          fi
          sort /tmp/ty.old > /tmp/tys.old; sort /tmp/ty.new > /tmp/tys.new
          same_set=1;  cmp -s /tmp/tys.old /tmp/tys.new || same_set=0
          same_rest=1; cmp -s /tmp/rest.old /tmp/rest.new || same_rest=0
          same_order=1; cmp -s /tmp/ty.old /tmp/ty.new || same_order=0
          if [ "$same_set" = 1 ] && [ "$same_rest" = 1 ] && [ "$same_order" = 0 ]; then
            echo "VERDICT: ORDERING — same type SET, same non-type IR, different type ORDER."
            echo "         This is the mechanism t-47hc.14 describes."
          elif [ "$same_set" = 0 ]; then
            echo "VERDICT: TYPE SETS DIFFER — one side emitted types the other did not."
            echo "         NOT an ordering bug; t-47hc.14's premise does not cover this."
            diff /tmp/tys.old /tmp/tys.new | head -40 || true
          else
            echo "VERDICT: the NON-TYPE IR differs — function bodies or globals changed."
            echo "         Not a type-table problem at all; treat as a real behavioural diff."
            diff -u /tmp/rest.old /tmp/rest.new | head -60 || true
          fi

      - name: Upload the divergent IR (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: difftest-divergence-${{ github.run_id }}
          path: |
            bootstrap/build/difftest/work/self.old.ll
            bootstrap/build/difftest/work/self.new.ll
          retention-days: 14
          if-no-files-found: ignore
