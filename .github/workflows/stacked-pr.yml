# t-xkcw — the checkless-PR guard.
#
# Every gate in this repo (bootstrap-window, diff-test, rc-strict,
# seed-train-verify) is filtered to PRs whose BASE is the integration
# branch:
#
#   on:
#     pull_request:
#       branches: [feat/crafting-intepreters]
#
# The PR-slice workflow (CLAUDE.md) mandates STACKING — slice N+1's PR
# bases on slice N's branch — so a stacked PR matches none of those
# filters and runs NO gate at all. CodeRabbit skips it too ("auto
# reviews are disabled on base/target branches other than the default
# branch"). `get_check_runs` returns total_count: 0.
#
# That is a trap, not a nuisance. The standing merge authorization is
# "CI is green AND CodeRabbit approved", and on a stacked PR both
# signals are ABSENT rather than red — an empty checks list reads as
# "nothing failed". The failure mode is merging an unvalidated slice
# under a rule that assumed validation happened. Observed live on
# #1164 (stacked on #1163): zero checks, no review, both by
# construction.
#
# This workflow is the complement of those filters: it fires on
# exactly the bases they ignore, and FAILS. The red check is the
# point — it converts a silent absence into a visible stop, and it
# costs seconds because it builds nothing.
#
# Failing is the correct outcome, not an over-reaction: the documented
# flow never merges a PR while it is stacked. When the lower slice
# merges you rebase and RE-TARGET this PR's base to the integration
# branch, at which point the four real gates fire and this one stops
# running. There is nothing to fix in the branch's code.
#
# The REBASE is load-bearing there, not incidental (t-ghmn). The gates
# declare a bare `pull_request:`, so they inherit the default activity
# types [opened, synchronize, reopened]. Changing a base fires `edited`,
# which is NOT in that set — so a re-target BY ITSELF does not start
# them. What starts them is the rebase's push (`synchronize`). Re-target
# without pushing and you get the worst reading available: this guard no
# longer matches `branches-ignore` so it does not re-run, but its earlier
# FAILING check run stays pinned to the head SHA — a red "no gate ran on
# this base" sitting on a PR whose base is now correct and whose gates
# still have not run. It fails closed (that red blocks the merge), but it
# is describing a condition that no longer holds.
#
# So: always rebase-and-re-target, never re-target alone. t-ghmn tracks
# making that a guarantee in config rather than a convention — the
# candidate fix (`types: [..., edited]` plus a base-changed `if:`) is
# deliberately NOT applied here, because an `if:` that mis-evaluates
# makes a gate SKIP SILENTLY, which is this file's own failure mode
# reintroduced by its own fix. It needs proving on a real PR first.
#
# A stacked slice is the common case but not the only one this catches
# — a PR into any other long-lived branch (`main`, say) is equally
# ungated today, so the message states the FACT first and offers the
# re-target step as the stacked-slice remedy rather than asserting it
# is the only reading. Classifying the base by name would be a
# heuristic; stating what did and did not run is not.
#
# DECISION (t-xkcw option 1, rejected for now): widening the gates'
# filters to `claude/**` so stacked PRs run them for real was
# considered and NOT done. diff-test's oracle is defined as "the
# integration branch" (OLD) vs the PR (NEW); on a stacked PR the base
# is a feature branch, so OLD would either have to stay the
# integration branch — making the comparison span the whole stack and
# attribute every lower slice's divergence to the top one, including
# ones a lower PR already landed under an `intended-ir-change` label —
# or become the stacked base, which is not an oracle (it is unmerged,
# unvalidated code). Neither is defensible without redefining the
# oracle, and the gates do run before a slice reaches integration
# anyway. Revisit by resolving the OLD-side definition first.
#
# The invariant this pair of files upholds — every PR base is covered
# by at least one workflow — is lint-enforced by
# `diagnose.sh --check-ci-gates`, so deleting this file or narrowing
# its ignore-list fails the suite instead of silently restoring the
# checkless state.
name: stacked-pr

on:
  pull_request:
    # The exact complement of every gate's `branches:` allowlist. The
    # lint asserts that equality, so the two can never drift apart.
    branches-ignore: [feat/crafting-intepreters]

# Builds nothing, checks out nothing, reads nothing.
permissions: {}

concurrency:
  group: stacked-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-deferred:
    name: gates deferred — no gate ran on this base
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report that no gate ran
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "## No gate ran on this PR"
            echo
            echo "Base branch: \`${BASE_REF}\` — not the integration branch."
            echo
            echo "bootstrap-window, diff-test, rc-strict and seed-train-verify are"
            echo "all filtered to PRs based on \`feat/crafting-intepreters\`, so none"
            echo "of them fired here. CodeRabbit skips non-default bases too. The"
            echo "checks list being empty means the gates were NEVER RUN — it does"
            echo "not mean they passed. That is the whole reason this check exists:"
            echo "to give the absence a visible shape."
            echo
            echo "**If this is a stacked slice** (the common case), nothing in the"
            echo "branch needs fixing. Do not merge it while stacked: when the lower"
            echo "slice merges, **rebase AND re-target** this PR's base to"
            echo "\`feat/crafting-intepreters\`. The four gates then run for real and"
            echo "this check stops running."
            echo
            echo "The rebase is required, not optional (t-ghmn). The gates use the"
            echo "default \`pull_request\` activity types, and a base change fires"
            echo "\`edited\`, which is not among them — so re-targeting ALONE starts"
            echo "nothing. The rebase's push (\`synchronize\`) is what starts them. If"
            echo "you re-target without pushing, this check does not re-run either,"
            echo "and its existing red stays pinned to the head SHA while the gates"
            echo "sit un-run. If you ever see this check red on a PR already based on"
            echo "\`feat/crafting-intepreters\`, that is the state you are in — push"
            echo "(or re-run the gates) rather than reading the red as a code problem."
            echo
            echo "**If this PR deliberately targets another long-lived branch**, no"
            echo "gate covers that base at all — decide that deliberately rather than"
            echo "reading an empty checks list as approval."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Gates deferred::No gate ran on this PR — base '${BASE_REF}' is not the integration branch, so bootstrap-window, diff-test, rc-strict and seed-train-verify were never triggered. See the job summary."
          exit 1
