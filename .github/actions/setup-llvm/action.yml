# Shared LLVM 20 provisioning for the bootstrap workflows. The pinned
# major lives in scripts/bootstrap.sh + bootstrap/scripts/diagnose.sh;
# this action mirrors it for CI runners.
name: setup-llvm
description: Install the pinned LLVM 20 toolchain (distro archive first, apt.llvm.org fallback)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Prefer the distro archive; only fall back to executing the
        # apt.llvm.org bootstrap script (remote code under sudo) when
        # the runner's archive doesn't carry LLVM 20 yet.
        sudo apt-get update -y
        if ! sudo apt-get install -y --no-install-recommends \
            llvm-20 llvm-20-dev llvm-20-tools clang-20 lld-20; then
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 20
          sudo apt-get install -y --no-install-recommends llvm-20-dev lld-20 clang-20
        fi
        # diagnose.sh probes `ld.lld` by name for the @-symbol-safe linker.
        sudo ln -sf /usr/lib/llvm-20/bin/ld.lld /usr/local/bin/ld.lld
