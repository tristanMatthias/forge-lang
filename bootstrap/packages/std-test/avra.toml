# @std/test — testing primitives.

[package]
name        = "@std/test"
version     = "0.1.0"
description = "Unit/integration testing primitives for Avra projects"

[lib]
name = "std-test"
path = "src/test.av"

[dependencies]
# `libmode` resolves the @std/* producer objects a test run links against,
# which means reading the compiler's own content-addressed build cache
# (build.cache_for / cache_entry_realobj_path / Fingerprint).
"@std/avrac" = { path = "../std-avrac" }
